<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunt the Code</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
  <div class="brand">IEEE Information Theory Society</div>
  <h1>Hunt the Code</h1>
  <p class="muted">Log in with the team code the organisers gave you. Every member logs in on their own phone.</p>

  <form class="card" id="form">
    <div class="notice bad" id="error" role="alert"></div>
    <label for="code">Team code</label>
    <input type="text" id="code" class="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" required>
    <label for="name">Your name</label>
    <input type="text" id="name" autocomplete="name" maxlength="60" required>
    <label for="reg">Registration number</label>
    <input type="text" id="reg" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20" required>
    <button class="block" id="go">Join the hunt</button>
  </form>
  <p class="small muted">Organiser? <a href="/admin">Admin login</a></p>
</main>
<script>
const next = new URLSearchParams(location.search).get('next');
const safeNext = next && /^\/s\/[A-Za-z0-9]+$/.test(next) ? next : null;
const onward = (consented) =>
  location.replace(consented ? (safeNext || '/play') : '/consent' + (safeNext ? '?next=' + encodeURIComponent(safeNext) : ''));

// Already logged in on this phone? Skip the form.
fetch('/api/me').then((r) => r.ok ? r.json() : null).then((me) => { if (me) onward(me.consented); });

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const error = document.getElementById('error');
  btn.disabled = true; error.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ code: field('code'), name: field('name'), regNo: field('reg') }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    onward(data.consented);
  } catch (err) {
    error.textContent = err.message || 'Could not log in. Check your connection and try again.';
    btn.disabled = false;
  }
});
function field(id) { return document.getElementById(id).value; }
</script>
</body>
</html>
